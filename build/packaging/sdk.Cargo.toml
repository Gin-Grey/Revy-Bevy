[workspace]
members = ["engine/crates/arisna_engine"]
exclude = ["engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Gin-Grey/Revy-Bevy"

[workspace.dependencies]
bevy = { path = "engine", features = ["bevy_feathers", "file_watcher"] }
