[workspace]
members = ["engine/crates/arisna_engine", "editor", "project"]
exclude = ["engine"]
default-members = ["editor"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Gin-Grey/Revy-Bevy"

[workspace.dependencies]
bevy = { path = "engine", features = ["bevy_feathers", "file_watcher"] }
bevy_ufbx = "0.19.0"
arisna_engine = { path = "engine/crates/arisna_engine" }
revy_engine = { package = "arisna_engine", path = "engine/crates/arisna_engine" }
ron = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }

[patch.crates-io]
bevy = { path = "engine" }

# Faster iterative compiles while learning / prototyping the editor.
[profile.dev]
opt-level = 1
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 1
